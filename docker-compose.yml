version: '3.8'

services:
  skillbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-ai-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=skillbridge_production_secure_jwt_secret_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo_key}
    volumes:
      - skillbridge-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  skillbridge-data:
    driver: local
